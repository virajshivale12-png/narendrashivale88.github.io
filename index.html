<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-YCE1H1SYB1"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-YCE1H1SYB1');
</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A simple personal website." />
  <title>My Website</title>
  <style>
    :root { color-scheme: dark; --bg: #0b1020; --panel: #121a2e; --text: #f4f7ff; --muted: #aab5cc; --accent: #8b9cff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Arial, Helvetica, sans-serif; color: var(--text); background: radial-gradient(circle at top, #202d55 0, var(--bg) 55%); }
    main { width: min(760px, 100%); padding: clamp(28px, 6vw, 60px); border: 1px solid #293653; border-radius: 24px; background: rgba(18, 26, 46, .92); box-shadow: 0 24px 80px rgba(0,0,0,.35); }
    .eyebrow { color: var(--accent); font-size: .8rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 16px 0; font-size: clamp(2.5rem, 8vw, 4.5rem); line-height: 1.05; }
    p { max-width: 55ch; color: var(--muted); font-size: 1.08rem; line-height: 1.75; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
    a { display: inline-block; padding: 12px 18px; border: 1px solid #46557b; border-radius: 999px; color: var(--text); text-decoration: none; }
    a:hover, a:focus-visible { background: var(--accent); border-color: var(--accent); color: #0b1020; }
    footer { margin-top: 44px; color: #8390aa; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Welcome</div>
    <h1>Your website is live.</h1>
    <p>This is a fresh starting page for your GitHub Pages website. Replace this text with your own introduction, projects, or other information.</p>
    <nav aria-label="Main navigation">
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="mailto:you@example.com">Contact</a>
    </nav>
    <section id="about" aria-label="About" hidden></section>
    <section id="projects" aria-label="Projects" hidden></section>
    <footer>© <span id="year"></span> My Website</footer>
  </main>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
